```yaml
name: Sync PizazzGY Source

on:

  # GitHub Actions 定时检查
  schedule:
    - cron: "*/5 * * * *"

  # 允许手动运行
  workflow_dispatch:

  # 修改同步程序时自动测试
  push:
    paths:
      - "scripts/sync.py"
      - ".github/workflows/sync.yml"


permissions:
  contents: write


jobs:

  sync:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 1. 拉取自己的仓库
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. 安装 Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------
      # 3. 执行同步
      # ------------------------------------------------------

      - name: Sync upstream
        run: |
          python scripts/sync.py

      # ------------------------------------------------------
      # 4. 查看变化
      # ------------------------------------------------------

      - name: Check changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------
      # 5. 有变化才提交
      # ------------------------------------------------------

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add www/api.json
          git add www/.source_sha256

          git commit -m "sync: update upstream source"

          git push
```
